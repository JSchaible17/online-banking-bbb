*{box-sizing:border-box}body{margin:0;min-height:100svh}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px}button{min-height:48px}main{width:min(800px,calc(100% - 32px));margin:0 auto;padding:28px 0 35px}header{color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-size:.8rem;letter-spacing:.13em;font-weight:800;text-transform:uppercase}.brand:before{content:"";display:inline-block;width:25px;height:3px;background:var(--amber);vertical-align:middle;margin-right:12px}.course{font-size:.8rem;color:#c4d1d3}.panel{background:var(--paper);padding:clamp(23px,5vw,48px);border-radius:17px;box-shadow:0 16px 45px #0002}.eyebrow{font-size:.77rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}h1{font-size:clamp(2rem,6vw,3.15rem);line-height:1.09;letter-spacing:-.035em;margin:0 0 21px}h2{font-size:clamp(1.6rem,4.6vw,2.25rem);line-height:1.17;letter-spacing:-.025em;margin:0 0 20px}p{line-height:1.6}p:last-child{margin-bottom:0}.intro{font-size:1.08rem;color:var(--muted);max-width:49ch}.ticketline{display:flex;gap:20px;flex-wrap:wrap;margin:28px 0;color:var(--ink);font-size:.95rem}.ticketline strong{color:var(--accent)}.primary{border:0;background:var(--ink);color:white;padding:15px 24px;border-radius:9px;font-weight:750;min-width:165px}.primary:hover{background:#284c60}.secondary{border:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 18px;border-radius:9px;font-weight:650}.secondary:hover{background:var(--wash)}.startbutton{background:var(--amber);color:var(--ink);margin-top:8px}.startbutton:hover{background:#f4ad43}.privacy{font-size:.78rem;color:var(--muted);margin-top:25px}.meta{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:.84rem;color:var(--muted);margin-bottom:12px}.progress{height:5px;background:#dddeda;border-radius:99px;margin-bottom:30px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}.scenario{font-size:1.1rem;line-height:1.55;margin:0 0 24px}.statement{border-left:3px solid var(--amber);padding-left:18px;font-size:1.22rem;line-height:1.5;margin:25px 0}.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}.choice{border:1.5px solid #aebabe;background:transparent;color:var(--ink);border-radius:9px;padding:18px 12px;font-weight:750;font-size:1.2rem}.choice[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}.choice:disabled{opacity:1}.wordbank{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 23px}.chip{border:1.5px solid #b9c4c7;border-radius:9px;background:#fffdf8;color:var(--ink);font-weight:700;padding:11px 16px;user-select:none}.chip[aria-pressed=true]{background:var(--amber);border-color:#a26120}.chip.used{opacity:.5;border-style:dashed}.chip:disabled{opacity:.8}.instruction{font-size:.88rem;color:var(--muted);line-height:1.5}.cloze{font-size:1.08rem;line-height:2.7}.blank{display:inline-block;padding:3px 12px;min-width:94px;min-height:42px;line-height:1.4;border:1.5px dashed #899ca3;border-radius:6px;background:white;color:var(--ink);vertical-align:middle}.blank.filled{border-style:solid;background:#f7e4c4}.assign{display:grid;gap:12px;margin:24px 0}.assign-row{display:grid;grid-template-columns:1fr minmax(120px,.65fr);gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;font-size:.99rem}.drop{border:1.5px dashed #899ca3;border-radius:7px;background:#fffdf8;min-height:52px;padding:9px;color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center}.drop.filled{border-style:solid;background:#f7e4c4}.drop.targeted{outline:3px solid var(--amber)}.drop small{color:var(--muted);font-size:.78rem;font-weight:500}.equation{display:flex;align-items:center;justify-content:center;gap:14px;margin:25px 0 30px;min-width:0}.x{font-weight:750;font-size:1.45rem;white-space:nowrap}.fraction{display:inline-grid;grid-template-rows:auto auto;max-width:100%;min-width:220px;font-size:1.35rem}.numerator{display:flex;align-items:center;justify-content:center;gap:12px;border-bottom:2px solid var(--ink);padding:0 9px 12px}.numerator>.times{flex:0 0 14px;font-size:1.7rem;font-weight:800;text-align:center}.denominator{display:flex;justify-content:center;padding-top:12px}.fraction .drop{min-width:82px;min-height:52px}.fraction .money-slot{min-width:112px}.resultfields{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:25px 0}.field label{display:block;font-size:.88rem;font-weight:700;margin-bottom:9px}.euroinput{display:flex;align-items:center;gap:9px}.euroinput input{width:100%;min-width:0;padding:13px 12px;border:1.5px solid #9eafb7;border-radius:7px;background:white;color:var(--ink);min-height:50px;font-size:1.15rem}.euroinput span{font-weight:700}.actionbar{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;align-items:center}.feedback{margin-top:22px;border-left:4px solid var(--green);background:#e7f1e9;padding:15px 18px;border-radius:0 8px 8px 0;line-height:1.55}.feedback.wrong{border-color:var(--rose);background:#f8eae3}.feedback.neutral{border-color:#728490;background:#e9eef0}.feedback h3{font-size:1rem;margin:0 0 5px}.feedback p{margin:0}.solution{font-weight:600;line-height:1.7}.hint{margin-top:22px;font-size:.9rem;color:var(--muted)}.hint summary{cursor:pointer;min-height:40px;padding:8px 0;font-weight:650}.hint p{margin:4px 0 0}.result-number{color:var(--accent);font-size:clamp(3rem,9vw,5rem);font-weight:850;letter-spacing:-.06em;line-height:1.05;margin:24px 0 15px}.summary-list{padding:0;list-style:none;margin:27px 0;display:grid;gap:10px}.summary-list li{padding-bottom:10px;border-bottom:1px solid var(--line);line-height:1.45}.summary-list span{color:var(--muted);font-size:.83rem}.footer{color:#c0cdd2;font-size:.77rem;text-align:center;padding:20px 0 0;line-height:1.6}.subtle{color:var(--muted)}[hidden]{display:none!important}@media(max-width:520px){main{width:calc(100% - 24px);padding-top:19px}header{margin-bottom:18px}.course{font-size:.74rem}.panel{padding:25px 20px}.resultfields{grid-template-columns:1fr;gap:16px}.assign-row{grid-template-columns:1fr 125px;gap:12px}.fraction{min-width:205px}.fraction .drop{min-width:66px}.fraction .money-slot{min-width:104px}.equation{gap:8px}.x{font-size:1.2rem}.chip{padding:10px 13px}.numerator{gap:9px;padding-left:0;padding-right:0}.actionbar .primary{flex:1}.cloze{line-height:2.8}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media print{body{background:white}header,.footer,.actionbar{display:none}.panel{box-shadow:none;padding:0}main{width:100%}}

<main><header><div class="brand">Kino-Check</div><div class="course">BwR · Klasse 7</div></header><div id="app"></div><footer class="footer">Vermehrter und verminderter Grundwert<br>Deine Eingaben bleiben auf diesem Gerät. Ohne Anmeldung.</footer></main>
<noscript><p style="color:white;text-align:center">Bitte aktiviere JavaScript, um das Lernspiel zu öffnen.</p></noscript>
<script id="quiz-engine">
'use strict';
const QuizCore=(()=>{
const questions=[
{id:'basis',kind:'yesno',type:'Ja oder Nein',label:'Die Bezugsgröße',title:'Was entspricht 100 %?',statement:'Der ursprüngliche Grundwert entspricht auch nach einer Preiserhöhung weiterhin 100 %.',answer:true,explanation:'Ja. Die Erhöhung bezieht sich auf den ursprünglichen Grundwert. Er bleibt die Bezugsgröße mit 100 %.',hint:'Auf welchen Preis bezieht sich die Erhöhung?'},
{id:'rabatt',kind:'yesno',type:'Ja oder Nein',label:'Rabatt richtig deuten',title:'20 % Rabatt: Was bleibt?',statement:'Nach 20 % Rabatt entspricht der neue Preis 20 % des ursprünglichen Preises.',answer:false,explanation:'Nein. 20 % beschreiben nur den Rabatt. Der neue Preis entspricht 100 % − 20 % = 80 % des ursprünglichen Preises.',hint:'Unterscheide die Ersparnis und den Preis, den du noch bezahlst.'},
{id:'begriffe',kind:'cloze',type:'Wortspeicher',label:'Begriffe vervollständigen',title:'Mehr oder weniger?',words:['weniger','erhöht','mehr','verringert'],answers:['erhöht','mehr','verringert','weniger'],explanation:'Beim vermehrten Grundwert wird erhöht: Der neue Wert entspricht mehr als 100 %. Beim verminderten Grundwert wird verringert: Der neue Wert entspricht weniger als 100 %.',hint:'Vergleiche beide Veränderungen jeweils mit den ursprünglichen 100 %.'},
{id:'zuordnen',kind:'match',type:'Kärtchen zuordnen',label:'Geld und Prozent',title:'Welche Angaben gehören zusammen?',scenario:'Eine Kinokarte kostet nach 25 % Erhöhung jetzt 15,00 €.',words:['25 %','15,00 €','100 %','125 %'],answers:['15,00 €','125 %','25 %','100 %'],labels:['Bekannter neuer Preis','Prozentsatz des neuen Preises','Erhöhungssatz','Prozentsatz des ursprünglichen Preises'],explanation:'15,00 € sind der neue Preis und gehören zu 125 %. Die Erhöhung beträgt 25 %. Der ursprüngliche Preis entspricht weiterhin 100 %.',hint:'Der bekannte Preis enthält bereits die Erhöhung. Addiere 25 % zu den ursprünglichen 100 %.'},
{id:'bruchplus',kind:'fraction',type:'Rechenbruch',label:'Vermehrter Grundwert',title:'Wie hoch ist die Erhöhung?',scenario:'Eine Karte kostet nach 20 % Erhöhung jetzt 12,00 €. Berechne die Erhöhung und den ursprünglichen Preis.',words:['100','20','12,00 €','120'],answers:['12,00 €','20','120'],amount:12,change:20,percent:120,sign:-1,result:2,old:10,firstLabel:'Erhöhung in Euro',explanation:'Erhöhung: (12,00 € · 20) : 120 = 2,00 €. Ursprünglicher Preis: 12,00 € − 2,00 € = 10,00 €. Die bekannten 12,00 € gehören zu 120 %.',hint:'Gesucht sind zuerst die 20 % Erhöhung. Die bekannten 12,00 € entsprechen 120 %, nicht 100 %.'},
{id:'bruchminus',kind:'fraction',type:'Rechenbruch',label:'Verminderter Grundwert',title:'Wie viel wurde gespart?',scenario:'Eine Karte kostet nach 20 % Rabatt noch 8,00 €. Berechne die Ersparnis und den ursprünglichen Preis.',words:['20','100','80','8,00 €'],answers:['8,00 €','20','80'],amount:8,change:20,percent:80,sign:1,result:2,old:10,firstLabel:'Ersparnis in Euro',explanation:'Ersparnis: (8,00 € · 20) : 80 = 2,00 €. Ursprünglicher Preis: 8,00 € + 2,00 € = 10,00 €. Die bekannten 8,00 € gehören zu 80 %.',hint:'Der Preis nach 20 % Rabatt gehört zu 80 %. Die gesuchte Ersparnis gehört zu 20 %.'},
{id:'rechnenplus',kind:'calculate',type:'Selbst rechnen',label:'Preiserhöhung',title:'Der neue Preis enthält die Erhöhung',scenario:'Ein Kopfhörer kostet nach 10 % Preiserhöhung jetzt 66,00 €. Berechne die Erhöhung und den ursprünglichen Preis.',amount:66,change:10,percent:110,sign:-1,result:6,old:60,firstLabel:'Erhöhung in Euro',explanation:'66,00 € entsprechen 110 %. Erhöhung: (66,00 € · 10) : 110 = 6,00 €. Ursprünglicher Preis: 66,00 € − 6,00 € = 60,00 €.',hint:'Berechne zuerst die Erhöhung aus dem bekannten neuen Preis. Ziehe sie anschließend vom neuen Preis ab.'},
{id:'rechnenminus',kind:'calculate',type:'Selbst rechnen',label:'Preisnachlass',title:'Wie teuer war der Hoodie vorher?',scenario:'Ein Hoodie kostet nach 25 % Rabatt noch 36,00 €. Berechne die Ersparnis und den ursprünglichen Preis.',amount:36,change:25,percent:75,sign:1,result:12,old:48,firstLabel:'Ersparnis in Euro',explanation:'36,00 € entsprechen 75 %. Ersparnis: (36,00 € · 25) : 75 = 12,00 €. Ursprünglicher Preis: 36,00 € + 12,00 € = 48,00 €.',hint:'Nach 25 % Rabatt bleiben 75 %. Addiere die Ersparnis zum verminderten Preis, um den ursprünglichen Preis zu erhalten.'}
];
function parseMoney(raw){if(typeof raw!=='string')return null;const s=raw.trim().replace(/\s/g,'').replace(/€$/,'');if(!/^\d+(?:[.,]\d{1,2})?$/.test(s))return null;const n=Number(s.replace(',','.'));return Number.isFinite(n)?n:null;}
function sameMoney(raw,n){const x=parseMoney(raw);return x!==null&&Math.abs(x-n)<.005;}
function validate(q,a){if(q.kind==='yesno'){if(typeof a.choice!=='boolean')return {complete:false,correct:false};return {complete:true,correct:a.choice===q.answer};}if(q.kind==='cloze'||q.kind==='match'){const filled=Array.isArray(a.slots)&&a.slots.length===q.answers.length&&a.slots.every(x=>typeof x==='string'&&x.length>0);return {complete:filled,correct:filled&&q.answers.every((x,i)=>x===a.slots[i])};}const numberComplete=parseMoney(a.first)!==null&&parseMoney(a.old)!==null;const slotsComplete=q.kind!=='fraction'||(Array.isArray(a.slots)&&a.slots.length===3&&a.slots.every(Boolean));return {complete:numberComplete&&slotsComplete,correct:numberComplete&&slotsComplete&&sameMoney(a.first,q.result)&&sameMoney(a.old,q.old)&&(q.kind!=='fraction'||q.answers.every((x,i)=>a.slots[i]===x))};}
return Object.freeze({questions,parseMoney,sameMoney,validate});
})();
</script>
<script id="quiz-ui">
'use strict';
(()=>{
const app=document.querySelector('#app'),Q=QuizCore.questions;
let order=Q.map((_,i)=>i),index=0,results=[],answer={},selected=null,attempts=0,done=false,seenWrong=false,review=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function intro(){app.innerHTML=`<section class="panel"><p class="eyebrow">Dein Abschlusscheck</p><h1>Vermehrter und<br>verminderter Grundwert</h1><p class="intro">Der Kinoabend ist teurer geworden. Beim nächsten Angebot gibt es Rabatt. Wie sicher rechnest du mit beiden Veränderungen?</p><div class="ticketline"><span><strong>8</strong> Aufgaben</span><span>etwa <strong>5–8 Minuten</strong></span><span>Handy oder Tablet</span></div><p>Prüfe Aussagen, vervollständige Merksätze und berechne Preise. Du bekommst zu jeder Aufgabe eine Rückmeldung. Papier und Stift helfen beim Rechnen.</p><button class="primary startbutton" id="start">Spiel starten</button><p class="privacy">Kein Name, kein Konto. Das Spiel speichert keine persönlichen Angaben.</p></section>`;document.querySelector('#start').addEventListener('click',()=>start(false));}
function start(isReview=false){if(!isReview){order=Q.map((_,i)=>i);review=false;}else{order=results.filter(x=>!x.firstTry).map(x=>x.qIndex);review=true;}index=0;results=[];load();}
function load(){const q=Q[order[index]];answer={slots:Array(q.answers?.length||0).fill(''),choice:null,first:'',old:''};selected=null;attempts=0;done=false;seenWrong=false;render();}
function pool(q){return `<div class="wordbank" aria-label="Wortspeicher">${q.words.map(w=>`<button type="button" class="chip" draggable="true" data-word="${esc(w)}" aria-pressed="false">${esc(w)}</button>`).join('')}</div>`;}
function slot(i,label,cls=''){return `<button type="button" class="${cls||'drop'}" data-slot="${i}" aria-label="${esc(label)}"><small>${esc(label)}</small></button>`;}
function fields(q){return `<div class="resultfields"><div class="field"><label for="first">${esc(q.firstLabel)}</label><div class="euroinput"><input id="first" type="text" inputmode="decimal" autocomplete="off" aria-describedby="moneyhint"><span>€</span></div></div><div class="field"><label for="old">Ursprünglicher Preis</label><div class="euroinput"><input id="old" type="text" inputmode="decimal" autocomplete="off" aria-describedby="moneyhint"><span>€</span></div></div></div><p id="moneyhint" class="instruction">Du kannst zum Beispiel 2 oder 2,00 eingeben.</p>`;}
function questionBody(q){if(q.kind==='yesno')return `<p class="instruction">Überprüfe die Aussage.</p><p class="statement">${esc(q.statement)}</p><div class="choice-row"><button type="button" class="choice" data-choice="yes" aria-pressed="false">Ja</button><button type="button" class="choice" data-choice="no" aria-pressed="false">Nein</button></div>`;
if(q.kind==='cloze')return `<p class="instruction">Vervollständige den Text mit dem Wortspeicher. Tippe zuerst auf ein Wort und dann auf die passende Lücke.</p>${pool(q)}<div class="cloze">Beim vermehrten Grundwert wird der ursprüngliche Grundwert ${slot(0,'Lücke 1','blank')}. Der neue Wert entspricht ${slot(1,'Lücke 2','blank')} als 100 %.<br>Beim verminderten Grundwert wird der ursprüngliche Grundwert ${slot(2,'Lücke 3','blank')}. Der neue Wert entspricht ${slot(3,'Lücke 4','blank')} als 100 %.</div>`;
if(q.kind==='match')return `<p class="scenario">${esc(q.scenario)}</p><p class="instruction">Ordne die Kärtchen zu. Tippe zuerst ein Kärtchen an, dann das passende Feld. Am Computer kannst du auch ziehen.</p>${pool(q)}<div class="assign">${q.labels.map((l,i)=>`<div class="assign-row"><span>${esc(l)}</span>${slot(i,'Feld '+(i+1))}</div>`).join('')}</div>`;
if(q.kind==='fraction')return `<p class="scenario">${esc(q.scenario)}</p><p class="instruction">Vervollständige den Rechenbruch mit den Kärtchen. Berechne anschließend beide Geldbeträge.</p>${pool(q)}<div class="equation"><span class="x">x =</span><div class="fraction"><div class="numerator">${slot(0,'Geldbetrag','drop money-slot')}<span class="times" aria-label="mal">·</span>${slot(1,'Prozentzahl')}</div><div class="denominator">${slot(2,'Prozentzahl')}</div></div></div>${fields(q)}`;
return `<p class="scenario">${esc(q.scenario)}</p><p class="instruction">Nutze deinen Rechenbruch auf Papier und trage die Ergebnisse ein.</p>${fields(q)}`;}
function render(){const q=Q[order[index]];app.innerHTML=`<section class="panel" aria-labelledby="question-title"><div class="meta"><span>${review?'Trainingsrunde':esc(q.type)}</span><span>Aufgabe ${index+1} von ${order.length}</span></div><div class="progress" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="${order.length}" aria-valuenow="${index}"><span style="width:${100*index/order.length}%"></span></div><p class="eyebrow">${esc(q.label)}</p><h2 id="question-title" tabindex="-1">${esc(q.title)}</h2><form id="answer-form" novalidate>${questionBody(q)}<div id="feedback" role="status" aria-live="polite" hidden></div><div class="actionbar"><button class="primary" type="submit" id="check">Prüfen</button><button class="secondary" type="button" id="show-solution" hidden>Lösung ansehen</button><button class="primary" type="button" id="next" hidden>${index+1===order.length?'Auswertung':'Weiter'}</button></div></form><details class="hint"><summary>Ein Tipp</summary><p>${esc(q.hint)}</p></details></section>`;
app.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{if(done)return;answer.choice=b.dataset.choice==='yes';app.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));clearFeedback();}));
app.querySelectorAll('[data-word]').forEach(b=>{b.addEventListener('click',()=>{if(done)return;selected=selected===b.dataset.word?null:b.dataset.word;sync();});b.addEventListener('dragstart',e=>{if(done){e.preventDefault();return;}selected=b.dataset.word;e.dataTransfer.setData('text/plain',selected);e.dataTransfer.effectAllowed='move';sync();});});
app.querySelectorAll('[data-slot]').forEach(b=>{b.addEventListener('click',()=>place(Number(b.dataset.slot),selected));b.addEventListener('dragover',e=>{if(!done){e.preventDefault();b.classList.add('targeted');}});b.addEventListener('dragleave',()=>b.classList.remove('targeted'));b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('targeted');place(Number(b.dataset.slot),e.dataTransfer.getData('text/plain'));});});
for(const id of ['first','old']){const field=document.getElementById(id);if(field)field.addEventListener('input',()=>{answer[id]=field.value;clearFeedback();});}
document.querySelector('#answer-form').addEventListener('submit',e=>{e.preventDefault();check();});document.querySelector('#show-solution').addEventListener('click',()=>finish(false,true));document.querySelector('#next').addEventListener('click',()=>{index++;if(index===order.length)summary();else load();});sync();window.scrollTo({top:0,behavior:'instant'});document.querySelector('#question-title').focus({preventScroll:true});}
function place(i,w){if(done)return;const q=Q[order[index]];if(!w){answer.slots[i]='';sync();clearFeedback();return;}if(!q.words.includes(w))return;const prior=answer.slots.indexOf(w);const existing=answer.slots[i];if(prior!==-1&&prior!==i)answer.slots[prior]=existing||'';answer.slots[i]=w;selected=null;sync();clearFeedback();}
function sync(){app.querySelectorAll('[data-word]').forEach(b=>{b.setAttribute('aria-pressed',String(selected===b.dataset.word));b.classList.toggle('used',answer.slots.includes(b.dataset.word));b.disabled=done;b.draggable=!done;});app.querySelectorAll('[data-slot]').forEach(b=>{const v=answer.slots[Number(b.dataset.slot)];b.classList.toggle('filled',Boolean(v));if(v)b.textContent=v;else b.innerHTML=`<small>${esc(b.getAttribute('aria-label'))}</small>`;b.disabled=done;});}
function clearFeedback(){if(done)return;const f=document.querySelector('#feedback');f.hidden=true;}
function feedback(title,text,type){const f=document.querySelector('#feedback');f.className='feedback '+(type||'');f.innerHTML=`<h3>${esc(title)}</h3><p>${esc(text)}</p>`;f.hidden=false;}
function check(){if(done)return;const q=Q[order[index]],v=QuizCore.validate(q,answer);if(!v.complete){feedback('Es fehlt noch etwas.','Fülle alle Felder aus. Bei Geldbeträgen sind Zahlen mit Komma oder Punkt möglich.','neutral');return;}attempts++;if(v.correct)finish(!seenWrong,false);else{seenWrong=true;feedback('Noch nicht ganz.',q.hint,'wrong');document.querySelector('#show-solution').hidden=false;}}
function finish(firstTry,shown){if(done)return;done=true;const q=Q[order[index]];results.push({qIndex:order[index],firstTry:firstTry&&!shown,shown});feedback(shown?'Die Lösung':(firstTry?'Richtig!':'Jetzt stimmt es!'),q.explanation,shown?'neutral':'');document.querySelector('#check').hidden=true;document.querySelector('#show-solution').hidden=true;document.querySelector('#next').hidden=false;app.querySelectorAll('input,[data-choice]').forEach(el=>el.disabled=true);selected=null;sync();document.querySelector('#next').focus({preventScroll:true});}
function summary(){const first=results.filter(x=>x.firstTry).length,missed=results.length-first;app.innerHTML=`<section class="panel"><p class="eyebrow">${review?'Deine Trainingsrunde':'Dein Kino-Check'}</p><h1>Geschafft!</h1><p>Du hast ${order.length} Aufgaben bearbeitet.</p><div class="result-number">${first} von ${order.length}</div><p class="intro">${first===order.length?'Alle Aufgaben direkt richtig gelöst.': 'Aufgaben direkt richtig gelöst. Die unsicheren Aufgaben kannst du gezielt noch einmal üben.'}</p><ul class="summary-list">${results.map(x=>`<li>${x.firstTry?'✓':'↻'} ${esc(Q[x.qIndex].label)}<br><span>${x.firstTry?'Direkt richtig':x.shown?'Lösung angesehen':'Nach Rückmeldung gelöst'}</span></li>`).join('')}</ul><div class="actionbar">${missed?'<button class="primary" id="retry">Unsichere Aufgaben üben</button>':''}<button class="secondary" id="restart">Ganz neu starten</button></div><p class="privacy">Zeige diese Auswertung deiner Lehrkraft, wenn sie danach fragt. Es wird nichts automatisch verschickt.</p></section>`;document.querySelector('#restart').addEventListener('click',()=>start(false));document.querySelector('#retry')?.addEventListener('click',()=>start(true));window.scrollTo({top:0,behavior:'instant'});}
intro();
})();
</script>
</body></html>
